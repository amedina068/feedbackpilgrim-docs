name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check that llms.txt and llms-full.txt are current
        run: node scripts/build-llms.mjs --check

      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amedina068/feedbackpilgrim
          path: .app

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, exif, redis
          tools: composer:v2

      - name: Install the PHP packages of the app
        working-directory: .app
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check the docs against the app
        env:
          FEEDBACKPILGRIM_APP_PATH: ${{ github.workspace }}/.app
        run: node scripts/check-docs.mjs
